name: Build SEO product pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: seo-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generator against repository
        run: node --test scripts/seo.test.mjs
      - name: Generate from published Google Sheet
        run: node scripts/build-seo.mjs . _site
      - name: Validate generated site
        run: node scripts/check-seo.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SEO_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v4
