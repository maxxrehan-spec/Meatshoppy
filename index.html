<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meat Market | Fresh Meat Delivered to Your Door</title>
<meta name="description" content="Fresh chicken, beef and mutton with home delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="logo" href="#home">Meat Market</a>
  <nav id="nav">
    <a href="#home" data-i="nHome"></a><a href="#shop" data-i="nShop"></a><a href="#about" data-i="nAbout"></a><a href="#contact" data-i="nContact"></a>
  </nav>
  <button class="lang" id="langBtn" aria-label="Language">العربية</button>
  <button class="cartBtn" id="cartBtn" aria-label="Cart">🛒<b id="cartCount">0</b></button>
</header>

<main id="main">
<section id="home" class="hero">
  <div class="hero-in">
    <h1 data-i="heroT"></h1>
    <p data-i="heroS"></p>
    <a class="btn" href="#shop" data-i="shopNow"></a>
  </div>
</section>

<section class="sec"><h2 data-i="cats"></h2><div class="cats" id="catTiles"></div></section>
<section class="sec"><h2 data-i="best"></h2><div class="grid" id="bestGrid"></div></section>

<section id="shop" class="sec"><h2 data-i="nShop"></h2>
  <input type="search" id="q" class="search" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="grid" id="shopGrid"></div>
</section>

<section id="about" class="sec tint narrow"><h2 data-i="nAbout"></h2><p data-i="aboutP"></p></section>
<section id="contact" class="sec narrow"><h2 data-i="nContact"></h2>
  <p><span data-i="phone"></span>: <a id="phoneLink"></a></p>
  <p><a id="waLink2" target="_blank" rel="noopener">WhatsApp</a></p>
  <p data-i="hours"></p>
</section>
<section class="wa"><h2 data-i="waT"></h2><a class="btn light" id="waLink" target="_blank" rel="noopener" data-i="waB"></a></section>

<section class="sec"><h2 data-i="why"></h2>
  <div class="feat">
    <div><b data-i="w1t"></b><p data-i="w1d"></p></div>
    <div><b data-i="w2t"></b><p data-i="w2d"></p></div>
    <div><b data-i="w3t"></b><p data-i="w3d"></p></div>
    <div><b data-i="w4t"></b><p data-i="w4d"></p></div>
  </div>
</section>

<section class="sec tint"><h2 data-i="how"></h2>
  <ol class="steps"><li data-i="h1"></li><li data-i="h2"></li><li data-i="h3"></li><li data-i="h4"></li></ol>
</section>

</main>

<!-- Checkout view -->
<main id="checkoutView" hidden>
  <section class="sec narrow">
    <button class="link" id="backBtn" data-i="back"></button>
    <h2 data-i="checkout"></h2>
    <div class="summary" id="coSummary"></div>
    <form id="coForm" novalidate>
      <label><span data-i="fName"></span><input name="name" required autocomplete="name"></label>
      <label><span data-i="fMobile"></span><input name="mobile" type="tel" required inputmode="tel" autocomplete="tel" placeholder="05XXXXXXXX"></label>
      <label><span data-i="fArea"></span><input name="area" list="areaList" required autocomplete="off"><datalist id="areaList"></datalist></label>
      <label><span data-i="fAddr"></span><textarea name="address" rows="2" required></textarea></label>
      <label><span data-i="fBldg"></span><input name="building" required></label>
      <label><span data-i="fTime"></span><select name="time" id="timeSel"></select></label>
      <label><span data-i="fNotes"></span><textarea name="notes" rows="2"></textarea></label>
      <fieldset><legend data-i="pay"></legend>
        <label class="radio"><input type="radio" name="pay" value="cod" checked><span data-i="cod"></span></label>
        <label class="radio"><input type="radio" name="pay" value="online"><span data-i="online"></span></label>
        <small data-i="payNote"></small>
      </fieldset>
      <p class="err" id="coErr" role="alert"></p>
      <button class="btn full" type="submit" data-i="place"></button>
    </form>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><h3 data-i="cart"></h3><button class="x" id="closeCart" aria-label="Close">✕</button></div>
  <div class="drawer-body" id="cartItems"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>
<div class="scrim" id="scrim"></div>

<footer>© <span id="yr"></span> Meat Market</footer>
<script src="app.js"></script>
</body>
</html>
